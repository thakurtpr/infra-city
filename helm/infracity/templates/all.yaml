apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: { app: infracity-agent }
spec:
  selector: { matchLabels: { app: infracity-agent } }
  template:
    metadata: { labels: { app: infracity-agent } }
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      {{- if .Values.agent.privilegedEBPF }}
      hostNetwork: true # eBPF socket tracing needs host netns
      # hostNetwork pods use the node's resolver by default, which cannot
      # resolve Services; ClusterFirstWithHostNet restores cluster DNS.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: agent
          image: {{ .Values.agent.image }}
          env:
            - { name: INFRACITY_BACKEND, value: "http://{{ .Release.Name }}-backend:8080" }
            - { name: INFRACITY_CLUSTER, value: {{ .Values.clusterId | quote }} }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: INFRACITY_EBPF_DEBUG, value: {{ .Values.agent.ebpfDebug | quote }} }
            {{- if .Values.backend.authToken }}
            - { name: INFRACITY_TOKEN, value: {{ .Values.backend.authToken | quote }} }
            {{- end }}
          ports: [{ name: health, containerPort: 8081 }]
          {{- if .Values.agent.privilegedEBPF }}
          # tracefs/debugfs from the host mount namespace: tracepoint attach
          # needs them; unprivileged installs mount nothing (least privilege).
          volumeMounts:
            - { name: tracing, mountPath: /sys/kernel/tracing }
            - { name: debugfs, mountPath: /sys/kernel/debug }
            # host cgroupfs (read-only): cgroup-id -> container -> pod
            # attribution walks directory inodes, no PID lifetime race.
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
          {{- end }}
          {{- if .Values.agent.privilegedEBPF }}
          # eBPF socket tracing needs uid 0 + caps (see ebpf/README.md).
          # Pair with the agent-ebpf image target (distroless root).
          securityContext: { privileged: true, runAsUser: 0, runAsNonRoot: false, capabilities: { add: [BPF, NET_ADMIN, SYS_RESOURCE] } }
          {{- else }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: { drop: [ALL] } }
          {{- end }}
          livenessProbe: { httpGet: { path: /health, port: 8081 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: 8081 }, periodSeconds: 5 }
          resources: {{ .Values.agent.resources | toYaml | nindent 12 }}
      {{- if .Values.agent.privilegedEBPF }}
      volumes:
        - { name: tracing, hostPath: { path: /sys/kernel/tracing } }
        - { name: debugfs, hostPath: { path: /sys/kernel/debug } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: infracity-backend } }
  template:
    metadata: { labels: { app: infracity-backend } }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          args:
            - --addr=:8080
            {{- if .Values.backend.authToken }}
            - --auth-token={{ .Values.backend.authToken }}
            {{- end }}
          ports: [{ containerPort: 8080 }]
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
          resources: {{ .Values.backend.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: infracity-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector: { matchLabels: { app: infracity-ui } }
  template:
    metadata: { labels: { app: infracity-ui } }
    spec:
      containers:
        - name: ui
          image: {{ .Values.frontend.image }}
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: {{ .Values.frontend.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: infracity-ui }
  ports: [{ port: 80, targetPort: 80 }]
