apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels: { app: infracity-agent }
spec:
  selector: { matchLabels: { app: infracity-agent } }
  template:
    metadata: { labels: { app: infracity-agent } }
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      {{- if .Values.agent.privilegedEBPF }}
      hostNetwork: true # eBPF socket tracing needs host netns
      {{- end }}
      containers:
        - name: agent
          image: {{ .Values.agent.image }}
          env:
            - { name: INFRACITY_BACKEND, value: "http://{{ .Release.Name }}-backend:8080" }
            - { name: INFRACITY_CLUSTER, value: {{ .Values.clusterId | quote }} }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            {{- if .Values.backend.authToken }}
            - { name: INFRACITY_TOKEN, value: {{ .Values.backend.authToken | quote }} }
            {{- end }}
          ports: [{ name: health, containerPort: 8081 }]
          {{- if .Values.agent.privilegedEBPF }}
          securityContext: { privileged: true, capabilities: { add: [BPF, NET_ADMIN, SYS_RESOURCE] } }
          {{- else }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: { drop: [ALL] } }
          {{- end }}
          livenessProbe: { httpGet: { path: /health, port: 8081 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: 8081 }, periodSeconds: 5 }
          resources: {{ .Values.agent.resources | toYaml | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: infracity-backend } }
  template:
    metadata: { labels: { app: infracity-backend } }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          args: ["--addr=:8080"]
          ports: [{ containerPort: 8080 }]
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
          resources: {{ .Values.backend.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: infracity-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector: { matchLabels: { app: infracity-ui } }
  template:
    metadata: { labels: { app: infracity-ui } }
    spec:
      containers:
        - name: ui
          image: {{ .Values.frontend.image }}
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: infracity-ui }
  ports: [{ port: 80, targetPort: 80 }]
