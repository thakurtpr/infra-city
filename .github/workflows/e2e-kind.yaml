# SPDX-License-Identifier: Apache-2.0
name: e2e-kind
# Full loop: build images → kind → demo town → helm install → API assertions.
on:
  push: { branches: [main] }
  workflow_dispatch: {}

# Least privilege: the loop builds local images and runs kind; nothing writes.
permissions: { contents: read }

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with: { cluster_name: infracity, kubectl_version: v1.31.0 }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Build images
        run: |
          docker build -t infracity/backend:e2e -f Dockerfile --target backend .
          docker build -t infracity/agent:e2e -f Dockerfile --target agent .
          docker build -t infracity/frontend:e2e -f Dockerfile.frontend .
      - name: Load into kind
        run: kind load docker-image infracity/backend:e2e infracity/agent:e2e infracity/frontend:e2e --name infracity
      - name: Demo town + traffic
        run: |
          kubectl apply -f demo/manifests/
          kubectl apply -f demo/traffic-generator.yaml
          kubectl wait --for=condition=Available deploy/frontend deploy/api deploy/payments -n demo --timeout=180s
      - name: Helm install
        run: |
          helm install infracity helm/infracity --set clusterId=kind-ci \
            --set backend.image=infracity/backend:e2e \
            --set agent.image=infracity/agent:e2e \
            --set frontend.image=infracity/frontend:e2e --wait --timeout 3m
      - name: Assert live discovery
        run: |
          kubectl wait --for=condition=Ready pod -l app=infracity-backend --timeout=120s
          sleep 30  # two agent cycles
          kubectl port-forward svc/infracity-backend 8080:8080 & sleep 5
          curl -s localhost:8080/health -o /tmp/health.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/health.json"))["status"])')" = "ok"
          curl -s "localhost:8080/api/graph?cluster=kind-ci" -o /tmp/graph.json
          python3 -c "
          import json
          d = json.load(open('/tmp/graph.json'))
          assert len(d['nodes']) > 20, d
          types = {n['type'] for n in d['nodes']}
          assert {'pod','service','deployment'} <= types, types
          print('e2e graph OK:', len(d['nodes']), 'nodes,', len(d['edges']), 'edges')"
          curl -s -o /dev/null -w "backend %{http_code}\n" localhost:8080/api/clusters
      - name: Chaos recovery (kill + scale, polled)
        run: |
          kubectl delete pod -n demo -l app=api --grace-period=0 --force
          kubectl scale -n demo deploy/api --replicas=5
          for i in $(seq 1 24); do
            ready=$(kubectl get deploy/api -n demo -o jsonpath='{.status.readyReplicas}')
            [ "${ready:-0}" = "5" ] && break
            sleep 10
          done
          test "$(kubectl get deploy/api -n demo -o jsonpath='{.status.readyReplicas}')" = "5"
          for i in $(seq 1 12); do
            curl -s "localhost:8080/api/graph?cluster=kind-ci" -o /tmp/graph2.json
            if python3 -c "
          import json
          d = json.load(open('/tmp/graph2.json'))
          dep = [n for n in d['nodes'] if n['id']=='deployment/kind-ci/demo/api'][0]
          assert dep['metrics']['replicas'] == 5, dep
          "; then break; fi
            sleep 10
          done
          python3 -c "
          import json
          d = json.load(open('/tmp/graph2.json'))
          dep = [n for n in d['nodes'] if n['id']=='deployment/kind-ci/demo/api'][0]
          assert dep['metrics']['replicas'] == 5, dep
          print('chaos scale visible in city: replicas =', dep['metrics']['replicas'])"
          kubectl scale -n demo deploy/api --replicas=3
          kubectl wait --for=condition=Available deploy/api -n demo --timeout=180s
