# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require Signed-off-by on all commits in range
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          for c in $(git rev-list "$base"..HEAD); do
            git log -1 --format=%B "$c" | grep -q "^Signed-off-by: " \
              || { echo "Missing Signed-off-by in $c"; exit 1; }
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26", cache: true }
      - run: gofmt -l . | grep . && exit 1 || echo "gofmt clean"
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26", cache: true }
      - name: Forbid copyleft/non-allowlist Go licenses
        run: |
          go run github.com/google/go-licenses@latest report ./... \
            | grep -iE "GPL|AGPL|LGPL|BSL|SSPL|CC-BY-NC|WTFPL|Unlicense" \
            && { echo "FORBIDDEN LICENSE FOUND"; exit 1; } || echo "Go licenses clean"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26", cache: true }
      - name: Install BPF compile toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev
      - name: Compile probe (same flags as `make ebpf`)
        run: |
          mkdir -p agent/internal/ebpf/bpf
          clang -O2 -g -target bpf -c ebpf/sock-trace.bpf.c -o agent/internal/ebpf/bpf/sock-trace.bpf.o \
            || { sudo ln -sfn /usr/include/x86_64-linux-gnu/asm /usr/include/asm && \
                 clang -O2 -g -target bpf -c ebpf/sock-trace.bpf.c -o agent/internal/ebpf/bpf/sock-trace.bpf.o; }
      - run: gofmt -l agent/internal/ebpf | grep . && exit 1 || echo "gofmt clean"
      - name: Userspace packet-parser tests (same header as the probe)
        run: clang -O2 -Wall -Wextra -o /tmp/test_parse ebpf/tests/test_parse.c && /tmp/test_parse
      - run: GOOS=linux go build -tags ebpf_full ./...
      - run: GOOS=linux go vet -tags ebpf_full ./agent/...
      - run: go test -tags ebpf_full ./agent/...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint helm/infracity
      - run: helm template infracity helm/infracity --set clusterId=ci > /tmp/rendered.yaml
      - name: kubeconform rendered chart + demo manifests
        run: |
          docker run --rm -v "$PWD:/w" -v /tmp:/tmp ghcr.io/yannh/kubeconform:latest \
            -kubernetes-version 1.31.0 /tmp/rendered.yaml /w/demo/manifests /w/demo/traffic-generator.yaml
      - run: kubectl apply --dry-run=client -f /tmp/rendered.yaml 2>/dev/null || echo "(no cluster - template render check passed)"

  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26", cache: true }
      - run: go vet ./backend/...
      - env: { TEST_POSTGRES_DSN: "postgres://postgres:test@localhost:5432/postgres?sslmode=disable" }
        run: go test -count=1 ./backend/internal/store/
