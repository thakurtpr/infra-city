apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
# Demo town (mirrors backend SeedDemo): frontend -> checkout -> {api -> auth, api -> payments -> postgres, api -> redis, orders -> kafka}.
# App placeholders run nginx:alpine (probes hit :80, Services remap to the
# logical port); stateful roles keep their real images where cheap
# (postgres/redis). Every workload carries requests+limits and probes.
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: demo }
spec: { selector: { app: frontend }, ports: [{ port: 80, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: checkout, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: checkout } }
  template:
    metadata: { labels: { app: checkout } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: checkout, namespace: demo }
spec: { selector: { app: checkout }, ports: [{ port: 80, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: demo }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: demo }
spec: { selector: { app: api }, ports: [{ port: 8080, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: auth, namespace: demo }
spec: { selector: { app: auth }, ports: [{ port: 8080, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: demo }
spec: { selector: { app: payments }, ports: [{ port: 9090, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: demo }
spec: { selector: { app: orders }, ports: [{ port: 8080, targetPort: 80 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: demo }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, infracity-role: postgres } }
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          env: [{ name: POSTGRES_PASSWORD, value: demo }]
          ports: [{ containerPort: 5432 }]
          livenessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 20 }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: demo }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, infracity-role: redis } }
    spec:
      containers:
        - name: c
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          livenessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 15 }
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: demo }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
# Kafka placeholder: name-derived role (agent maps name "kafka" -> role kafka).
# Swap for a real broker (e.g. bitnami/kafka with KRaft) when load-testing streams.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: demo }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka, infracity-role: kafka } }
    spec:
      containers:
        - name: broker
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: demo }
spec: { selector: { app: kafka }, ports: [{ port: 9092, targetPort: 80 }] }
